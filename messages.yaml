error:
  access_denied: ❌ У вас нет доступа
  user_not_found: ❌ Пользователь <a href='tg://user?id={tg_id}'>{tg_id}</a> не найден
  unknown: ❌ Что-то пошло не так, пожалуйста, обратитесь к администратору (контакт в описании бота)

cancel: Действие отменено
ban: 🚫 Вы заблокированы и не можете использовать этого бота

paid:
  instruction: |
    Использование: /paid <tg_id> [кол-во месяцев (по умолчанию 3)]
    Пример: /paid 123456789 3

payment:
  broadcast:
    text: |
      🔔 <b>Подошел срок оплаты!</b>
    
      👤 <b>Пользователь:</b> <a href='tg://user?id={tg_id}'>{tg_id}</a>
      📧 <b>Telegram username:</b> @{username}
      📧 <b>Email в панели:</b> <code>{email}</code>
      📊 <b>Статус:</b> {status}
      
      Хотите отправить рассылку с напоминанием?
    button: 📢 Сделать рассылку должникам
    instruction: |
      📝 <b>Введите текст сообщения.</b>
      Оно будет отправлено всем, у кого статус оплаты 🟡 и 🔴 (исключая группу private)

      <i>Для отмены введите /cancel</i>
    starting: ⏳ Начинаю рассылку для {count} пользователей...
    cancel: Никто не должен оплату. Рассылка отменена.
  admin:
    button:
      confirm: ✅ Подтвердить (3 мес)
      reject: ❌ Отклонить
    confirmation:
      request:
        💸 <b>Пользователь сообщил об оплате!</b>
  
        👤 <b>Пользователь:</b> <a href='tg://user?id={tg_id}'>{tg_id}</a>
        📧 <b>Telegram username:</b> @{username}
  
        Подтвердить продление подписки на 3 месяца?
      response:
        success: ✅ Подписка для пользователь <a href='tg://user?id={tg_id}'>{tg_id}</a> продлена на {months} мес
        warning: ⚠️ Подписка продлена, но пользователь <a href='tg://user?id={tg_id}'>{tg_id}</a> заблокировал бота
  client:
    confirm:
      button: 💸 Я оплатил
      wait_response: ⏳ <i>Заявка на проверку оплаты отправлена администратору. Ожидайте подтверждения.</i>
    approve:
      response: ✅ <b>ОПЛАТА ПОДТВЕРЖДЕНА</b>
      text: |
        🎉 <b>Спасибо за оплату!</b>
        Подписка на VPN успешно продлена на {months} мес
    reject:
      response: ❌ <b>ОТКЛОНЕНО</b>
      text: |
        ❌ <b>Оплата не подтверждена</b>
        Пожалуйста, проверьте статус перевода или свяжитесь с администратором (контакт в описании бота)

status:
  expires: 🟡 ИСТЕКАЕТ (менее 7 дней)
  expired: 🔴 ПРОСРОЧЕНО
  synchronization:
    waiting: 🔄 Синхронизирую данные с панелью, подождите...
    error: ❌ Произошла ошибка при обновлении данных из панели
  client_table:
    empty: <i>Пусто</i>
    row: "  - <a href='tg://user?id={tg_id}'>{tg_id}</a> | {username} | 📧 {email}\n"
  message:
    text: |
      📊 <b>Статус оплат (без учета группы private):</b>
    
      🟢 <b>Оплачено ({paid_count} чел.):</b>
      {paid_list}
      🟡 <b>Истекает менее 7 дней ({expires_count} чел.):</b>
      {expires_list}
      🔴 <b>Просрочено ({expired_count} чел.):</b>
      {expired_list}
    
      Для продления: <code>/paid &lt;tg_id&gt; [мес]</code>
    truncate: |
      ...
      
      <i>(Список обрезан из-за лимита длины сообщений Telegram)</i>

broadcast:
  instruction: "Использование: /broadcast <текст сообщения>"
  starting: ⏳ Начинаю рассылку для {users_count} пользователей...
  success: |
    ✅ Рассылка завершена.
    Успешно доставлено: {send_count} из {users_count}
  error: ❌ Произошла ошибка при рассылке

database_backup:
  not_found: ❌ Файл базы данных <code>users.db</code> не найден на сервере
  failed: ❌ Не удалось отправить файл базы данных
  caption: 📦 <b>Резервная копия локальной базы данных бота</b>

create_token:
  wait: Получение токена, подождите...
  error: ❌ Ошибка при создании токена
  success: |
    ✅ <b>Ваша персональная подписка готова!</b>
    
    По этой ссылке ваше приложение автоматически загрузит все доступные протоколы.
    
    🔗 <b>Ваша ссылка подписки:</b>
    <pre>{sub_link}</pre>
    
    <i>Скопируйте её и добавьте в приложение (v2rayN, V2Box, Happ) через опцию <b>'Добавить подписку'</b></i>
    Подробная инструкция по команде /help

register:
  admin:
    button:
      approve: ✅ Разрешить
      reject: ❌ Отклонить
    new_client: |
      Новый пользователь: {full_name} {username}
      Telegram ID: <a href='tg://user?id={tg_id}'>{tg_id}</a>
  client:
    response:
      wait: Заявка отправлена администратору. Ожидайте
      retry: Ваша заявка на рассмотрении администратора. Пожалуйста, ожидайте
    approve:
      response: ✅ <b>ОДОБРЕНО</b>
      text: |
        🎉 Администратор одобрил доступ!
        Введите /help для получения инструкций.
    reject: К сожалению, вам отказано в доступе

instruction:
  admin: |+
    
    🛠 <b>Команды администратора:</b>
    /status — статус оплат пользователей и запуск рассылки должникам
    /paid &lt;tg_id&gt; [мес] — продлить подписку пользователю (по умолч. 3 мес)
    /getdb — выгрузить резервную копию базы данных (users.db)
    /broadcast &lt;текст&gt; — массовая рассылка всем пользователям с активным VPN
    /cancel — отменить текущий ввод текста (для рассылки)
  common: |
    <b>Список доступных команд:</b>
    /create_token - получить ссылку на VPN подписку
    /help - помощь
    {admin_instruction}
    <b>Инструкция по установке:</b>
    
    1️⃣ Получить свою персональную ссылку подписки с помощью команды /create_token
    
    2️⃣ Скачать и установить клиент для VPN:
        - <b>Windows:</b> <a href='https://www.happ.su/main/ru'>Скачать Happ</a> 
            (Необходимо загрузить <code>setup-Happ.x64.exe</code>) 
            Запустите скачанный файл установщика ➔ Выполните установку приложения ➔ Запустите установленное приложение
            (Если официальный сайт не открывается, то можно скачать с GitHub тот же файл: <a href='https://github.com/Happ-proxy/happ-desktop/releases'>GitHub</a>)
        - <b>Android:</b> <a href='https://play.google.com/store/apps/details?id=com.happproxy'>Скачать Happ (Google Play)</a>
        - <b>iPhone (iOS), macOS:</b> <a href='https://apps.apple.com/us/app/happ-proxy-utility/id6504287215?l=ru'>Скачать Happ (App Store)</a>
    
    3️⃣ Скопировать полученную ссылку подписки и добавить её в клиент.
    📱 <b>На телефоне:</b> 
    Нажмите <b>«+»</b> (сверху) ➔ Выберите <i>«Добавить подписку»</i> ➔ Вставьте скопированную ссылку подписки в поле URL ➔ Нажмите <i>«Сохранить»</i>.
    
    💻 <b>На компьютере:</b>
    Вставьте скопированную ссылку подписки в поле URL ➔ Включите VPN
    
    ℹ️<i>Режим Proxy включает VPN только для браузера и мессенджеров.
    Режим TUN включает VPN для всей системы. </i>
    
    ⚡ <b>Как протестировать и выбрать сервер:</b> 
    Нажмите на кнопку со спидометра. Рядом с каждым протоколом появятся цифры в миллисекундах. 
    Выберите любой рабочий сервер с наименьшим пингом, кликнув на него. 
    
    4️⃣ <i>Дополнительно:</i> Вы можете настроить маршрутизацию, добавив определенные сайты (например, Госуслуги или банки) в список исключений, чтобы они работали напрямую без VPN.
